<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/sccl-app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="مؤسسة علو للمقاولات – ALU Contracting Est.">
  <meta name="theme-color" content="#1e3c72">
  
  <!-- iOS meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALU">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="icons/favicon_v2.ico">
  <link rel="shortcut icon" href="icons/favicon_v2.ico">
  
  <title>ALU - مؤسسة علو للمقاولات</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* خلفية متحركة خفيفة (دوائر ضبابية) */
    .bg-bubbles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .bg-bubbles div {
      position: absolute;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      animation: float 20s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      25% { transform: translateY(-20px) translateX(15px); }
      50% { transform: translateY(10px) translateX(-15px); }
      75% { transform: translateY(20px) translateX(10px); }
    }

    /* المحتوى الرئيسي */
    .splash-container {
      position: relative;
      z-index: 10;
      text-align: center;
      color: white;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .logo {
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: 5px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      margin-bottom: 10px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.5rem;
      opacity: 0.9;
      margin-bottom: 40px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    /* حاوية الجمل المتحرك */
    .camel-runner {
      position: relative;
      width: 100%;
      height: 120px;
      margin: 30px 0;
      overflow: hidden;
      border-radius: 100px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .camel-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      animation: run 12s linear infinite;
    }

    .camel {
      font-size: 5rem;
      line-height: 1;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
      transform: scaleX(-1); /* لجعل الجمل يتجه لليمين في الوضع RTL */
      animation: bounce 0.5s ease-in-out infinite alternate;
      white-space: nowrap;
    }

    /* إضافة عدة جمال */
    .camel:nth-child(2) {
      font-size: 4rem;
      margin-right: 20px;
      animation-delay: 0.2s;
      opacity: 0.8;
    }

    .camel:nth-child(3) {
      font-size: 3.5rem;
      margin-right: 15px;
      animation-delay: 0.4s;
      opacity: 0.6;
    }

    @keyframes run {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-150%); } /* يخفي الجمل بعد الخروج */
    }

    @keyframes bounce {
      from { transform: translateY(0) scaleX(-1); }
      to { transform: translateY(-10px) scaleX(-1); }
    }

    /* رسالة تحميل (خفيفة) */
    .loading-text {
      margin-top: 30px;
      font-size: 1.2rem;
      opacity: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dot-flash {
      display: inline-flex;
      gap: 5px;
    }

    .dot-flash div {
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      animation: flash 1.4s infinite ease-in-out both;
    }

    .dot-flash div:nth-child(1) { animation-delay: -0.32s; }
    .dot-flash div:nth-child(2) { animation-delay: -0.16s; }

    @keyframes flash {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    /* تخصيص لأحجام الشاشات الصغيرة */
    @media (max-width: 480px) {
      .logo { font-size: 3.5rem; }
      .subtitle { font-size: 1.2rem; }
      .camel { font-size: 4rem; }
    }
  </style>
</head>
<body>
  <!-- عناصر الخلفية (دوائر متحركة) -->
  <div class="bg-bubbles">
    <div style="width: 150px; height: 150px; top: 10%; left: 5%;"></div>
    <div style="width: 100px; height: 100px; bottom: 20%; right: 10%;"></div>
    <div style="width: 200px; height: 200px; top: 50%; left: 80%;"></div>
  </div>

  <div class="splash-container">
    <div class="logo">ALU</div>
    <div class="subtitle">مؤسسة علو للمقاولات</div>

    <!-- الجمل يجري -->
    <div class="camel-runner">
      <div class="camel-track">
        <span class="camel">🐪</span>
        <span class="camel">🐫</span>
        <span class="camel">🐪</span>
      </div>
    </div>

    <!-- مؤشر تحميل أنيق -->
    <div class="loading-text">
      <span>يجهز العدة</span>
      <div class="dot-flash">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
  </div>

  <!-- Flutter script -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
