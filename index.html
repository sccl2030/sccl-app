<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- قاعدة المسار لمشروع GitHub Pages - اسم المشروع alu -->
  <base href="/alu/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <!-- تحسين لمحركات البحث SEO -->
  <meta name="description" content="مؤسسة علو للمقاولات – ALU Contracting Est. متخصصون في أعمال المقاولات العامة والتشييد">
  <meta name="theme-color" content="#2196f3">
  
  <!-- معطيات iOS لتطبيق الويب -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALU">
  
  <!-- أيقونات iOS - المسار الصحيح للمشروع alu -->
  <link rel="apple-touch-icon" href="/alu/icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/alu/icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/alu/icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/alu/icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/alu/icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/alu/icons/Icon-512.png">
  
  <!-- أيقونات للمتصفحات - المسار الصحيح -->
  <link rel="icon" type="image/png" sizes="32x32" href="/alu/icons/favicon_v2.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/alu/icons/favicon_v2.png">
  <link rel="shortcut icon" href="/alu/icons/favicon_v2.png" type="image/x-icon">
  
  <!-- أيقونة للمتصفحات الحديثة -->
  <link rel="icon" type="image/svg+xml" href="/alu/icons/favicon_v2.png">
  
  <!-- أيقونة لمتصفح Safari على macOS -->
  <link rel="mask-icon" href="/alu/icons/favicon_v2.png" color="#2196f3">

  <title>ALU - مؤسسة علو للمقاولات</title>

  <!-- رابط ملف manifest مع المسار الصحيح -->
  <link rel="manifest" href="/alu/manifest.json">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 1.2rem;
      color: #2196f3;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">جاري تحميل التطبيق...</div>

  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // إخفاء رسالة التحميل بعد تحميل الصفحة
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading').style.display = 'none';
      }, 1000);
    });
    
    // التحقق من المسارات (للتشخيص)
    console.log('المشروع: alu');
    console.log('Apple Touch Icon:', document.querySelector('link[rel="apple-touch-icon"]')?.href);
    console.log('Favicon:', document.querySelector('link[rel="icon"]')?.href);
    console.log('Manifest:', document.querySelector('link[rel="manifest"]')?.href);
  </script>
</body>
</html>
