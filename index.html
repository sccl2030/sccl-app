<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- قاعدة المسار لمشروع GitHub Pages -->
  <base href="/sccl-app/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <!-- تحسين لمحركات البحث SEO -->
  <meta name="description" content="مؤسسة علو للمقاولات – ALU Contracting Est. متخصصون في أعمال المقاولات العامة والتشييد">
  <meta name="theme-color" content="#2196f3">
  
  <!-- معطيات iOS لتطبيق الويب -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALU">
  
  <!-- أيقونات iOS بأحجام مختلفة -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  
  <!-- أيقونة الشاشة الرئيسية لأجهزة iPad Pro (لأحجام أكبر) -->
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  
  <!-- شاشة البداية لنظام iOS (اختياري) - يمكن إضافتها إذا أردت -->
  <!--
  <link rel="apple-touch-startup-image" href="icons/splash.png">
  -->

  <!-- أيقونات للمتصفحات المختلفة -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon_v2.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon_v2.png">
  <link rel="shortcut icon" href="icons/favicon_v2.png" type="image/x-icon">
  
  <!-- أيقونة للمتصفحات الحديثة (SVG لو أمكن) -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon_v2.png">
  
  <!-- أيقونات للمفضلة في المتصفحات القديمة -->
  <link rel="mask-icon" href="icons/favicon_v2.png" color="#2196f3">

  <title>ALU - مؤسسة علو للمقاولات</title>

  <!-- رابط ملف manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- أنماط CSS بسيطة لتجربة أفضل (اختياري) -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
    }
    
    /* مؤشر تحميل بسيط */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 1.2rem;
      color: #2196f3;
    }
  </style>
</head>
<body>
  <!-- عنصر لعرض رسالة تحميل أثناء تحميل Flutter -->
  <div class="loading" id="loading">جاري تحميل التطبيق...</div>

  <!-- تضمين Flutter -->
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- إخفاء رسالة التحميل بعد تحميل Flutter (اختياري) -->
  <script>
    // إخفاء رسالة التحميل بعد تحميل الصفحة كاملة
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading').style.display = 'none';
      }, 1000);
    });
  </script>
</body>
</html>
