<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/sccl-app/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="مؤسسة علو للمقاولات – ALU Contracting Est.">
  <meta name="theme-color" content="#2196f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALU">

  <!-- أيقونات iOS و Favicon -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/x-icon" href="icons/favicon_v2.ico">
  <link rel="shortcut icon" href="icons/favicon_v2.ico">

  <title>ALU - مؤسسة علو للمقاولات</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(145deg, #f5f7fa 0%, #e9ecf2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .camel-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      padding: 2rem 3rem;
      border-radius: 60px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }

    .camel {
      font-size: 5rem;
      display: inline-block;
      animation: run 2s infinite ease-in-out;
      transform-origin: center;
      filter: drop-shadow(0 10px 15px rgba(33, 150, 243, 0.3));
    }

    @keyframes run {
      0% {
        transform: translateX(-20px) rotate(-5deg);
      }
      25% {
        transform: translateX(20px) rotate(5deg);
      }
      50% {
        transform: translateX(-15px) rotate(-3deg);
      }
      75% {
        transform: translateX(15px) rotate(3deg);
      }
      100% {
        transform: translateX(-20px) rotate(-5deg);
      }
    }

    /* طبقة خفيفة للغاية */
    .ground {
      width: 120px;
      height: 4px;
      background: #d4b28c;
      margin: 0 auto;
      border-radius: 2px;
      opacity: 0.3;
    }
  </style>
</head>
<body>
  <div class="camel-container">
    <div class="camel">🐪</div>
    <div class="ground"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
