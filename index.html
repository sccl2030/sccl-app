<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- قاعدة المسار لمشروع GitHub Pages -->
  <base href="/sccl-app/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <!-- SEO وتحسينات -->
  <meta name="description" content="مؤسسة علو للمقاولات – ALU Contracting Est.">
  <meta name="theme-color" content="#2196f3">
  
  <!-- iOS meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALU">
  
  <!-- أيقونات iOS -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  
  <!-- Favicon لجميع المتصفحات -->
  <link rel="icon" type="image/x-icon" href="icons/favicon_v2.ico">
  <link rel="shortcut icon" href="icons/favicon_v2.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon_v2.png">
  
  <title>ALU - مؤسسة علو للمقاولات</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Animate.css CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <style>
    /* إعادة تعيين الهوامش */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a2639 0%, #0d1b2a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }

    /* حاوية التحميل: تركز المحتوى في المنتصف */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
    }

    /* اللوجو بحجم كبير مع أنيميشن نبض */
    .logo-container {
      text-align: center;
    }

    .logo-container img {
      width: 400px;        /* حجم كبير */
      max-width: 80vw;      /* يستجيب للشاشات الصغيرة */
      height: auto;
      filter: drop-shadow(0 0 25px rgba(33, 150, 243, 0.8));
      animation: pulse 2s infinite ease-in-out;
    }

    /* تعريف بسيط للنبض (بدلاً من animate.css إذا أردت) */
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    /* يمكن استخدام animate.css أيضًا، لكن النبض المخصص أعلاه يعمل */
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo-container animate__animated animate__pulse animate__infinite">
      <!-- يمكن استخدام animate__pulse أو إزالة الكلاس والاعتماد على keyframes أعلاه -->
      <img src="icons/alu_logo.png" alt="ALU Logo">
    </div>
  </div>

  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // إخفاء شاشة التحميل بعد تحميل Flutter
    window.addEventListener('load', function() {
      // إبقاء الشاشة لمدة 2 ثانية على الأقل لتظهر بشكل جيد
      setTimeout(function() {
        document.getElementById('loading').style.opacity = '0';
        document.getElementById('loading').style.transition = 'opacity 0.5s';
        setTimeout(function() {
          document.getElementById('loading').style.display = 'none';
        }, 500);
      }, 2000);
    });

    console.log('✅ موقع ALU يعمل');
  </script>
</body>
</html>
