<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- قاعدة المسار لمشروع GitHub Pages -->
  <base href="/sccl-app/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <!-- SEO وتحسينات -->
  <meta name="description" content="مؤسسة علو للمقاولات – ALU Contracting Est.">
  <meta name="theme-color" content="#2196f3">
  
  <!-- iOS meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALU">
  
  <!-- أيقونات iOS -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  
  <!-- Favicon لجميع المتصفحات (بصيغة ICO للتوافق الأفضل) -->
  <link rel="icon" type="image/x-icon" href="icons/favicon_v2.ico">
  <link rel="shortcut icon" href="icons/favicon_v2.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon_v2.png">
  
  <title>ALU - مؤسسة علو للمقاولات</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Animate.css CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <style>
    /* إعادة تعيين الهوامش */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a2639 0%, #0d1b2a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }

    /* حاوية التحميل */
    #loading {
      text-align: center;
      color: white;
      width: 100%;
      max-width: 600px;
      padding: 2rem;
    }

    /* تصميم الشعار */
    .logo h1 {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: 8px;
      text-shadow: 0 0 20px #2196f3, 0 0 40px #64b5f6;
      margin-bottom: 1rem;
    }

    .logo p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 2rem;
      color: #e0e0e0;
    }

    /* أيقونة ALU الإضافية */
    .logo-icon {
      margin: 1.5rem 0;
    }

    .logo-icon img {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(33, 150, 243, 0.7));
    }

    /* شريط تقدم أنيق */
    .progress-bar {
      width: 80%;
      height: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      margin: 2rem auto 1rem;
      overflow: hidden;
    }

    .progress-fill {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, #2196f3, #64b5f6);
      border-radius: 10px;
      animation: loading 2s ease-in-out infinite;
    }

    @keyframes loading {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 60%; margin-left: 40%; }
      100% { width: 0%; margin-left: 100%; }
    }

    /* نص تحميل */
    .hint {
      color: #bbbbbb;
      font-size: 0.9rem;
      margin-top: 1rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">
      <h1 class="animate__animated animate__fadeInDown">ALU</h1>
      <p class="animate__animated animate__fadeInUp animate__delay-1s">مؤسسة علو للمقاولات</p>
    </div>

    <!-- أيقونة ALU مع أنيميشن نبض بسيط ومستمر -->
    <div class="logo-icon animate__animated animate__pulse animate__infinite">
      <img src="icons/alu_logo.png" alt="ALU Logo">
    </div>
    
    <div class="progress-bar animate__animated animate__fadeIn animate__delay-1s">
      <div class="progress-fill"></div>
    </div>
    
    <div class="hint animate__animated animate__fadeIn animate__delay-2s">صحراء المقاولات ... نتحرك بثبات</div>
  </div>

  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // إخفاء شاشة التحميل بعد تحميل Flutter
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading').style.opacity = '0';
        document.getElementById('loading').style.transition = 'opacity 0.5s';
        setTimeout(function() {
          document.getElementById('loading').style.display = 'none';
        }, 500);
      }, 2500);
    });

    console.log('✅ موقع ALU يعمل');
  </script>
</body>
</html>
